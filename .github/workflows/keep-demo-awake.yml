# Keeps the free hosted demo awake: Render's free web service sleeps after 15 idle minutes, and a FalkorDB Cloud free
# instance stops after a day without use. /v1/health runs a query against the database, so one ping covers both.
name: keep-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: curl -fsS --max-time 150 --retry 2 --retry-delay 10 https://graphable-api.onrender.com/v1/health
