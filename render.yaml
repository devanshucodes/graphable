# Render blueprint for the hosted demo (free plans): the REST API and the MCP server in one process, plus the web app.
# The database is FalkorDB Cloud. The web app is a static export (STATIC_EXPORT=1) served as a Render static site.
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: graphable-api
    runtime: docker
    plan: free
    region: singapore            # closest Render region to the FalkorDB Cloud instance (AWS ap-south-1)
    dockerfilePath: ./Dockerfile
    # the image's CMD serves on 8000, so PORT and MCP_URL are set to match
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: "8000"
      - key: MCP_URL             # the crew calls its tools over MCP on this same process
        value: http://127.0.0.1:8000/mcp
      - key: SERVE_MCP           # this process also serves the MCP endpoint at /mcp
        value: "1"
      - key: DEMO_SNAPSHOT       # restore the trimmed demo graph (fits the free 100 MB database)
        value: deploy/demo_snapshot.dump
      - key: TENANT_KEYS         # only the demo tenant exists in the hosted database
        value: dev-demo:demo_main
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY      # optional; without it the crew runs its deterministic offline policy
        sync: false

  - type: web                    # static site: the Next.js app exported to plain files
    name: graphable
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/out
    envVars:
      - key: STATIC_EXPORT
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://graphable-api.onrender.com/v1
      - key: NODE_VERSION
        value: "22"
